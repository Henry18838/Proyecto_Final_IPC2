<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>🔗 ConnectWork</h1>
      <p>Conectando talento con oportunidades</p>
    </div>

    <div class="login-body">
      <h2>Iniciar Sesión</h2>

      <div class="form-group">
        <label>Usuario</label>
        <input type="text" [(ngModel)]="username" placeholder="Tu nombre de usuario" class="form-control" />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" placeholder="Tu contraseña" class="form-control" />
      </div>

      <button class="btn-primary" (click)="login()" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>

      <p class="registro-link">
        ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
      </p>
    </div>
  </div>
</div>
